name: Upbit audit and early-surge regression
on:
  pull_request:
    paths:
      - "audit_store.py"
      - "monitor.py"
      - "minute_surge.py"
      - "five_minute_watch.py"
      - "tests/test_five_minute_watch.py"
      - "tests/test_audit_store.py"
      - "tests/test_minute_surge.py"
      - ".github/workflows/upbit-audit-surge-check.yml"
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Compile modified components
        run: |
          python -m py_compile audit_store.py five_minute_watch.py monitor.py minute_surge.py
      - name: Run complete regression suite
        run: |
          python -m pytest -q tests
