name: Frozen public4 2024 research computation
on:
  push:
    branches: [research/lbank-long-history-20261020]
    paths: [.github/workflows/lbank-public4-2024-once.yml]
permissions:
  contents: read
jobs:
  frozen-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact production policy source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 25388b431c9c9d38df6a434670586c65f382d604
          path: policy
          persist-credentials: false
      - name: Checkout frozen research input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: research-input
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install only calculation dependency
        run: python -m pip install ccxt==4.5.89
      - name: Prepare exact research programs and public original archives
        working-directory: policy
        run: |
          cp ../research-input/research/continuation/replay_full_management_20261020_2028.py prior.py
          cp ../research-input/research/continuation/replay_public4_2024_20261021_0138.py public4_replay.py
          cp ../research-input/research/continuation/verify_public4_general_20261021_0235.py verify_public4.py
          mkdir -p data
          curl --fail --location --retry 2 --max-time 90 https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-2024-01.zip --output data/bars.zip
          curl --fail --location --retry 2 --max-time 90 https://data.binance.vision/data/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2024-01.zip --output data/funding.zip
          echo '21eeac04a76a7a35b10467e5e752fb2f8cff77cdeb57df6b50a23ce8d69bb190  data/bars.zip' | sha256sum --check
          echo '3e0d30870672aa8f0f937881056e3cfd55913ae5c780cd50b33f2763aa0ba58e  data/funding.zip' | sha256sum --check
          sha256sum lbank_futures_monitor.py lbank_public_techniques.py lbank_performance.py lbank_native_entry.py public4_replay.py prior.py
      - name: Validate original study fixtures and execute frozen episode replay
        working-directory: policy
        run: |
          python -m unittest test_lbank_public_techniques -v
          python public4_replay.py --data data --output public4_2024_result.json
          python verify_public4.py --data data --report public4_2024_result.json --output verification.json
      - name: Preserve complete result in job logs
        working-directory: policy
        run: |
          python -c "from pathlib import Path; print('PUBLIC4_RESULT_BEGIN'); print(Path('public4_2024_result.json').read_text()); print('PUBLIC4_RESULT_END'); print('PUBLIC4_VERIFY_BEGIN'); print(Path('verification.json').read_text()); print('PUBLIC4_VERIFY_END')"
